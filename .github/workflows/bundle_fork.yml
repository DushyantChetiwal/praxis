# Installers for this fork, each built on the OS it targets.
#
# Upstream's `run_bundling.yml` cannot be used here: it runs on Zed Industries'
# private runners (`namespace-profile-mac-large`, `self-32vcpu-windows-2022`) and
# expects their Sentry, Apple and signing secrets. This builds each supported
# desktop platform on GitHub-hosted runners with no secrets at all.
#
# A macOS installer can only be produced on macOS — `script/bundle-mac` needs
# `hdiutil` to make the .dmg, plus `codesign` and the Apple SDK — which is why
# this workflow exists rather than a local build script.
#
# Desktop packages are UNSIGNED. Expect:
#   macOS   — Gatekeeper refuses the first open. Right-click → Open, or
#             `xattr -d com.apple.quarantine /Applications/Praxis\ Dev.app`.
#   Windows — SmartScreen warns about an unknown publisher.
#
# It runs automatically after a main PR merge passes Architect quality, after
# a successful upstream sync, or manually from the Actions tab.
#
# Kept as short as hosted runners allow:
#   - source trees with verified original quality receipts are not validated again;
#   - desktop and native remote servers build in parallel with isolated features;
#   - Windows builds alongside the Linux remote server it bundles for WSL,
#     collecting it just before making the installer;
#   - both macOS architectures build on Apple silicon, which is much faster
#     than the Intel runners;
#   - `test_build` makes only a Windows installer, with a lighter optimization
#     profile, for checking a change in the real app. It is never published.
name: Bundle Praxis
run-name: >-
  Bundle Praxis ${{ inputs.source_ref }}
  (macOS=${{ inputs.build_macos }}, Windows=${{ inputs.build_windows }},
  Linux=${{ inputs.build_linux }}, test=${{ inputs.test_build }})

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact branch, tag, or commit to build
        required: true
        default: main
        type: string
      build_macos:
        description: Build the macOS disk image
        required: false
        default: true
        type: boolean
      build_windows:
        description: Build the Windows installer
        required: false
        default: true
        type: boolean
      build_linux:
        description: Build the Linux desktop archive and remote server
        required: false
        default: true
        type: boolean
      test_build:
        description: Only a quicker Windows test installer, never published
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: bundle-fork
  cancel-in-progress: false

jobs:
  prepare:
    name: Pin the source revision
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      validated: ${{ steps.validated.outputs.validated }}
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Record the source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Reuse a verified original quality run of this source
        id: validated
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f script/praxis-validation.py ]]; then
            python script/praxis-validation.py check \
              --repository "${GITHUB_REPOSITORY}" --source-sha "${SOURCE_SHA}" \
              --wait-seconds 10800 || echo "validated=false" >> "${GITHUB_OUTPUT}"
          else
            echo "No validation receipt helper in this source; running full quality"
            echo "validated=false" >> "${GITHUB_OUTPUT}"
          fi

  quality:
    name: Validate the release source
    needs: prepare
    if: needs.prepare.outputs.validated != 'true'
    uses: ./.github/workflows/architect_quality.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}

  validated:
    name: Source validated
    needs:
      - prepare
      - quality
    # Quality is skipped for a revision that already passed it.
    if: >-
      !cancelled() &&
      needs.prepare.result == 'success' &&
      (needs.quality.result == 'success' ||
       (needs.quality.result == 'skipped' && needs.prepare.outputs.validated == 'true'))
    runs-on: ubuntu-24.04
    steps:
      - name: Record the validated revision
        run: echo "Building ${{ needs.prepare.outputs.source_sha }}"

  macos:
    name: macOS (${{ matrix.architecture }})
    # A skipped Architect quality run skips every job after it unless the
    # condition says otherwise, so each build checks the validation itself.
    if: >-
      !cancelled() && needs.validated.result == 'success' &&
      inputs.build_macos && !inputs.test_build
    needs:
      - prepare
      - validated
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          # Cross-compiled on Apple silicon, as upstream does. The Intel runners
          # took over an hour longer than every other platform.
          - architecture: x86_64
            runner: macos-15
            target: x86_64-apple-darwin
    env:
      CARGO_INCREMENTAL: "1"
      # Compile the Praxis release feed without redirecting any upstream cloud
      # traffic.
      PRAXIS_UPDATE_MANIFEST_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
      PRAXIS_RELEASE_ASSET_BASE_URL: https://github.com/${{ github.repository }}/releases/download/praxis-dev-${{ github.run_number }}-${{ github.run_attempt }}
      # `bundle-mac` ad-hoc signs when the Apple secrets are absent, which is the
      # case here. Left unset deliberately rather than defined empty.
      RUST_BACKTRACE: 1
    steps:
      - name: Check out the fork
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Restore incremental Rust build state
        id: build-cache
        uses: ./.github/actions/rust-build-cache
        with:
          cache-name: bundle-macos-${{ matrix.architecture }}
          legacy-key: bundle-macos-${{ matrix.architecture }}

      - name: Set up Node
        # `bundle-mac` installs `dmg-license` globally to attach the license
        # agreement to the .dmg.
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Show the toolchain
        # rustup honours rust-toolchain.toml, so the pinned version installs on
        # first use. Printing it makes a toolchain surprise obvious in the log.
        run: rustup show && cargo --version

      - name: Bundle
        env:
          CARGO_INCREMENTAL: "1"
        run: ./script/bundle-mac --desktop-only ${{ matrix.target }}

      - name: Save incremental Rust build state
        if: ${{ success() && steps.build-cache.outputs.primary-key != '' }}
        continue-on-error: true
        uses: ./.github/actions/save-rust-build-cache
        with:
          key: ${{ steps.build-cache.outputs.primary-key }}

      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          name: praxis-macos-${{ matrix.architecture }}-dmg
          path: target/${{ matrix.target }}/release/Praxis-${{ matrix.architecture }}.dmg
          if-no-files-found: error

  macos_remote_server:
    name: macOS remote server (${{ matrix.architecture }})
    if: >-
      !cancelled() && needs.validated.result == 'success' &&
      inputs.build_macos && !inputs.test_build
    needs:
      - prepare
      - validated
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: aarch64
            target: aarch64-apple-darwin
          - architecture: x86_64
            target: x86_64-apple-darwin
    env:
      CARGO_INCREMENTAL: "1"
      RUST_BACKTRACE: 1
    steps:
      - name: Check out the fork
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Restore incremental Rust build state
        id: build-cache
        uses: ./.github/actions/rust-build-cache
        with:
          cache-name: bundle-macos-remote-server-${{ matrix.architecture }}
          legacy-key: bundle-macos-remote-server-${{ matrix.architecture }}

      - name: Build and package the remote server
        env:
          CARGO_INCREMENTAL: "1"
        run: ./script/bundle-mac --remote-server-only ${{ matrix.target }}

      - name: Save incremental Rust build state
        if: ${{ success() && steps.build-cache.outputs.primary-key != '' }}
        continue-on-error: true
        uses: ./.github/actions/save-rust-build-cache
        with:
          key: ${{ steps.build-cache.outputs.primary-key }}

      - name: Upload the remote server
        uses: actions/upload-artifact@v7
        with:
          name: praxis-remote-server-macos-${{ matrix.architecture }}
          path: target/zed-remote-server-macos-${{ matrix.architecture }}.gz
          if-no-files-found: error

  linux_remote_server:
    name: Linux remote server (x86_64)
    # Bundled into the Windows installer for WSL, and published for Linux.
    if: >-
      !cancelled() && needs.validated.result == 'success' &&
      (inputs.build_linux || inputs.build_windows) && !inputs.test_build
    needs:
      - prepare
      - validated
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: "1"
      RUST_BACKTRACE: 1
    steps:
      - name: Check out the fork
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Restore incremental Rust build state
        id: build-cache
        uses: ./.github/actions/rust-build-cache
        with:
          cache-name: bundle-linux-remote-server-x86_64
          legacy-key: bundle-linux-remote-server-x86_64

      - name: Install Linux build dependencies
        run: ./script/linux

      - name: Download the WASI SDK
        run: ./script/download-wasi-sdk

      - name: Build the remote server
        env:
          CARGO_INCREMENTAL: "1"
        run: ./script/bundle-linux --remote-server-only

      - name: Save incremental Rust build state
        if: ${{ success() && steps.build-cache.outputs.primary-key != '' }}
        continue-on-error: true
        uses: ./.github/actions/save-rust-build-cache
        with:
          key: ${{ steps.build-cache.outputs.primary-key }}

      - name: Upload the remote server
        uses: actions/upload-artifact@v7
        with:
          name: praxis-remote-server-linux-x86_64
          path: target/zed-remote-server-linux-x86_64.gz
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    if: >-
      !cancelled() && needs.validated.result == 'success' &&
      inputs.build_linux && !inputs.test_build
    needs:
      - prepare
      - validated
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: "1"
      RUST_BACKTRACE: 1
      PRAXIS_UPDATE_MANIFEST_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
      PRAXIS_RELEASE_ASSET_BASE_URL: https://github.com/${{ github.repository }}/releases/download/praxis-dev-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Check out the fork
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Restore incremental Rust build state
        id: build-cache
        uses: ./.github/actions/rust-build-cache
        with:
          cache-name: bundle-linux-x86_64
          legacy-key: bundle-linux-x86_64

      - name: Install Linux build dependencies
        run: ./script/linux

      - name: Download the WASI SDK
        run: ./script/download-wasi-sdk

      - name: Bundle only the desktop app
        env:
          CARGO_INCREMENTAL: "1"
        run: ./script/bundle-linux --desktop-only

      - name: Save incremental Rust build state
        if: ${{ success() && steps.build-cache.outputs.primary-key != '' }}
        continue-on-error: true
        uses: ./.github/actions/save-rust-build-cache
        with:
          key: ${{ steps.build-cache.outputs.primary-key }}

      - name: Upload the desktop archive
        uses: actions/upload-artifact@v7
        with:
          name: praxis-linux-x86_64-archive
          path: target/release/praxis-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    if: >-
      !cancelled() && needs.validated.result == 'success' &&
      inputs.build_windows
    needs:
      - prepare
      - validated
    # Pinned to 2022 on purpose: `bundle-windows.ps1` expects Inno Setup 6 at its
    # default location, which the 2022 image has and later images may not.
    runs-on: windows-2022
    timeout-minutes: 240
    permissions:
      # Collects the Linux remote server from this run once it is uploaded.
      actions: read
      contents: read
    env:
      CARGO_INCREMENTAL: "1"
      RUST_BACKTRACE: 1
      PRAXIS_UPDATE_MANIFEST_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
      PRAXIS_RELEASE_ASSET_BASE_URL: ${{ !inputs.test_build && format('https://github.com/{0}/releases/download/praxis-dev-{1}-{2}', github.repository, github.run_number, github.run_attempt) || '' }}
      GH_TOKEN: ${{ github.token }}
      PRAXIS_CARGO_PROFILE: ${{ inputs.test_build && 'praxis-test' || 'release' }}
      # A test installer leaves WSL to the source-build fallback rather than
      # wait for a server it does not need.
      PRAXIS_LINUX_REMOTE_SERVER_ARTIFACT: ${{ !inputs.test_build && 'praxis-remote-server-linux-x86_64' || '' }}
    steps:
      - name: Check out the fork
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Configure Windows long-path support
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force

      - name: Restore incremental Rust build state
        id: build-cache
        uses: ./.github/actions/rust-build-cache
        with:
          cache-name: bundle-windows-x86_64-${{ inputs.test_build && 'test' || 'release' }}
          legacy-key: bundle-windows-x86_64-${{ inputs.test_build && 'test' || 'release' }}

      - name: Show the toolchain
        run: rustup show; cargo --version

      - name: Bundle
        env:
          CARGO_INCREMENTAL: "1"
        run: ./script/bundle-windows.ps1 -DesktopOnly
        shell: pwsh

      - name: Save incremental Rust build state
        if: ${{ success() && steps.build-cache.outputs.primary-key != '' }}
        continue-on-error: true
        uses: ./.github/actions/save-rust-build-cache
        with:
          key: ${{ steps.build-cache.outputs.primary-key }}

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          # `bundle-windows.ps1` names the installer after its target architecture.
          name: praxis-windows-x86_64-installer
          path: target/Praxis-x86_64.exe
          if-no-files-found: error

  windows_remote_server:
    name: Windows remote server (x86_64)
    if: >-
      !cancelled() && needs.validated.result == 'success' &&
      inputs.build_windows
    needs:
      - prepare
      - validated
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: "1"
      RUST_BACKTRACE: 1
      PRAXIS_CARGO_PROFILE: ${{ inputs.test_build && 'praxis-test' || 'release' }}
    steps:
      - name: Check out the fork
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Configure Windows long-path support
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force

      - name: Restore incremental Rust build state
        id: build-cache
        uses: ./.github/actions/rust-build-cache
        with:
          cache-name: bundle-windows-remote-server-x86_64-${{ inputs.test_build && 'test' || 'release' }}
          legacy-key: bundle-windows-remote-server-x86_64-${{ inputs.test_build && 'test' || 'release' }}

      - name: Build and package the remote server
        env:
          CARGO_INCREMENTAL: "1"
        run: ./script/bundle-windows.ps1 -RemoteServerOnly
        shell: pwsh

      - name: Save incremental Rust build state
        if: ${{ success() && steps.build-cache.outputs.primary-key != '' }}
        continue-on-error: true
        uses: ./.github/actions/save-rust-build-cache
        with:
          key: ${{ steps.build-cache.outputs.primary-key }}

      - name: Upload the remote server
        uses: actions/upload-artifact@v7
        with:
          name: praxis-remote-server-windows-x86_64
          path: target/zed-remote-server-windows-x86_64.zip
          if-no-files-found: error

  publish:
    name: Publish the self-update release
    if: >-
      always() &&
      !inputs.test_build &&
      inputs.build_macos &&
      inputs.build_windows &&
      inputs.build_linux &&
      needs.macos.result == 'success' &&
      needs.macos_remote_server.result == 'success' &&
      needs.windows.result == 'success' &&
      needs.windows_remote_server.result == 'success' &&
      needs.linux.result == 'success' &&
      needs.linux_remote_server.result == 'success'
    needs:
      - prepare
      - macos
      - macos_remote_server
      - windows
      - windows_remote_server
      - linux
      - linux_remote_server
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the built source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download the Windows installer
        uses: actions/download-artifact@v8
        with:
          name: praxis-windows-x86_64-installer
          path: release-assets

      - name: Download the macOS disk images
        uses: actions/download-artifact@v8
        with:
          pattern: praxis-macos-*-dmg
          path: release-assets
          merge-multiple: true

      - name: Download the Linux desktop archive
        uses: actions/download-artifact@v8
        with:
          name: praxis-linux-x86_64-archive
          path: release-assets

      - name: Download the remote servers
        uses: actions/download-artifact@v8
        with:
          pattern: praxis-remote-server-*
          path: release-assets
          merge-multiple: true

      - name: Create update manifests
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(python -c 'import tomllib; print(tomllib.load(open("crates/zed/Cargo.toml", "rb"))["package"]["version"])')"
          source_sha="$(git rev-parse HEAD)"
          tag="praxis-dev-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          release_version="${version}+praxis.${GITHUB_RUN_NUMBER}.${source_sha}"
          repository_url="https://github.com/${GITHUB_REPOSITORY}"
          windows_sha256="$(sha256sum release-assets/Praxis-x86_64.exe | cut -d ' ' -f 1)"
          macos_aarch64_sha256="$(sha256sum release-assets/Praxis-aarch64.dmg | cut -d ' ' -f 1)"
          macos_x86_64_sha256="$(sha256sum release-assets/Praxis-x86_64.dmg | cut -d ' ' -f 1)"
          linux_x86_64_sha256="$(sha256sum release-assets/praxis-linux-x86_64.tar.gz | cut -d ' ' -f 1)"

          jq -n \
            --arg version "${release_version}" \
            --arg url "${repository_url}/releases/download/${tag}/Praxis-x86_64.exe" \
            --arg sha256 "${windows_sha256}" \
            '{version: $version, url: $url, sha256: $sha256}' \
            > release-assets/praxis-update-windows-x86_64.json

          jq -n \
            --arg version "${release_version}" \
            --arg url "${repository_url}/releases/download/${tag}/Praxis-aarch64.dmg" \
            --arg sha256 "${macos_aarch64_sha256}" \
            '{version: $version, url: $url, sha256: $sha256}' \
            > release-assets/praxis-update-macos-aarch64.json

          jq -n \
            --arg version "${release_version}" \
            --arg url "${repository_url}/releases/download/${tag}/Praxis-x86_64.dmg" \
            --arg sha256 "${macos_x86_64_sha256}" \
            '{version: $version, url: $url, sha256: $sha256}' \
            > release-assets/praxis-update-macos-x86_64.json

          jq -n \
            --arg version "${release_version}" \
            --arg url "${repository_url}/releases/download/${tag}/praxis-linux-x86_64.tar.gz" \
            --arg sha256 "${linux_x86_64_sha256}" \
            '{version: $version, url: $url, sha256: $sha256}' \
            > release-assets/praxis-update-linux-x86_64.json

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-assets/Praxis-x86_64.exe
            release-assets/Praxis-aarch64.dmg
            release-assets/Praxis-x86_64.dmg
            release-assets/praxis-linux-x86_64.tar.gz
            release-assets/zed-remote-server-windows-x86_64.zip
            release-assets/zed-remote-server-macos-aarch64.gz
            release-assets/zed-remote-server-macos-x86_64.gz
            release-assets/zed-remote-server-linux-x86_64.gz
            release-assets/praxis-update-windows-x86_64.json
            release-assets/praxis-update-macos-aarch64.json
            release-assets/praxis-update-macos-x86_64.json
            release-assets/praxis-update-linux-x86_64.json

      - name: Publish the latest Praxis Dev release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # The release tag is created on the default branch. GITHUB_TOKEN is
          # refused a ref at a product commit whose workflow files differ from
          # the default branch, and the updater reads only the manifests, so the
          # source commit is recorded in the version and notes instead.
          gh release create "${{ steps.release.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${{ github.event.repository.default_branch }}" \
            --title "Praxis Dev ${{ steps.release.outputs.version }}" \
            --notes "Automated Praxis build from ${{ steps.release.outputs.source_sha }}. Desktop packages are unsigned." \
            --draft \
            release-assets/Praxis-x86_64.exe \
            release-assets/Praxis-aarch64.dmg \
            release-assets/Praxis-x86_64.dmg \
            release-assets/praxis-linux-x86_64.tar.gz \
            release-assets/zed-remote-server-windows-x86_64.zip \
            release-assets/zed-remote-server-macos-aarch64.gz \
            release-assets/zed-remote-server-macos-x86_64.gz \
            release-assets/zed-remote-server-linux-x86_64.gz \
            release-assets/praxis-update-windows-x86_64.json \
            release-assets/praxis-update-macos-aarch64.json \
            release-assets/praxis-update-macos-x86_64.json \
            release-assets/praxis-update-linux-x86_64.json

          gh release edit "${{ steps.release.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest

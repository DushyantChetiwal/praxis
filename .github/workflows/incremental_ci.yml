name: Incremental CI comparison

on:
  pull_request:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/architect/**
      - script/benchmark-ci-incremental.py
      - .github/workflows/incremental_ci.yml
      - .github/workflows/bundle_fork.yml
      - .github/actions/rust-build-cache/**
      - .github/actions/save-rust-build-cache/**
      - script/ci-incremental-cache.py
      - script/ci-build-checkpoint.py
      - script/test-ci-build-checkpoint.py
      - script/test-bundle-split-modes.py
      - script/test-bundle-windows-modes.ps1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: incremental-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Incremental tests and Clippy (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: disabled
            incremental: "0"
          - label: enabled
            incremental: "1"
    env:
      CARGO_INCREMENTAL: ${{ matrix.incremental }}
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: target/incremental-comparison
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: incremental-comparison-${{ matrix.label }}
          workspaces: . -> target/incremental-comparison
      - name: Measure initial, unchanged, and edited builds
        env:
          CARGO_INCREMENTAL: ${{ matrix.incremental }}
          EXPECTED_INCREMENTAL: ${{ matrix.incremental }}
        run: python script/benchmark-ci-incremental.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: incremental-comparison-${{ matrix.label }}
          path: ci-incremental-${{ matrix.incremental }}.json
          if-no-files-found: error

  checkpoint-seed:
    name: Seed release checkpoint (${{ matrix.os }})
    if: github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test checkpoint selection, archive safety, and private-repository policy
        run: python script/test-ci-build-checkpoint.py
      - name: Identify build state through the production action
        id: build-cache
        uses: ./.github/actions/rust-build-cache
        with:
          cache-name: checkpoint-smoke-${{ runner.os }}
      - name: Build the real Architect library with the release profile
        env:
          CHECKPOINT_KEY: ${{ steps.build-cache.outputs.primary-key }}
        run: |
          cargo build --locked --release -p architect --target-dir target/incremental-smoke
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path("target/incremental-smoke/release/incremental")
          files = sorted(path for path in root.rglob("*") if path.is_file())
          assert files, "The release build did not produce incremental compiler state"
          metadata = {
              "key": os.environ["CHECKPOINT_KEY"],
              "files": {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in files},
          }
          Path("checkpoint-fixture.json").write_text(json.dumps(metadata), encoding="utf-8")
          print(f"Recorded {len(files)} incremental files for fresh-runner verification")
          PY
      - name: Save through the production checkpoint action
        id: saved
        uses: ./.github/actions/save-rust-build-cache
        with:
          key: ${{ steps.build-cache.outputs.primary-key }}
      - name: Record the immutable checkpoint artifact
        env:
          CHECKPOINT_ARTIFACT: ${{ steps.saved.outputs.artifact-id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("checkpoint-fixture.json")
          metadata = json.loads(path.read_text(encoding="utf-8"))
          assert os.environ["CHECKPOINT_ARTIFACT"], "No build checkpoint was uploaded"
          metadata["artifact_id"] = os.environ["CHECKPOINT_ARTIFACT"]
          path.write_text(json.dumps(metadata), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: checkpoint-fixture-${{ matrix.os }}
          path: checkpoint-fixture.json
          retention-days: 7
          if-no-files-found: error

  checkpoint-restore:
    name: Restore release checkpoint on fresh runner (${{ matrix.os }})
    needs: checkpoint-seed
    if: github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "1"
      REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: checkpoint-fixture-${{ matrix.os }}
      - name: Read the fixture handoff
        id: fixture
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads(Path("checkpoint-fixture.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"key={metadata['key']}\nartifact-id={metadata['artifact_id']}\n")
          assert not Path("target/incremental-smoke").exists(), "Restore must start on a fresh runner"
          PY
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.fixture.outputs.artifact-id }}
          path: ${{ runner.temp }}/checkpoint-fixture
          merge-multiple: true
      - name: Restore the complete compiler state
        env:
          CHECKPOINT_KEY: ${{ steps.fixture.outputs.key }}
        run: python script/ci-build-checkpoint.py restore --directory "${{ runner.temp }}/checkpoint-fixture"
      - name: Verify restored incremental hashes and measure the warm build
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          metadata = json.loads(Path("checkpoint-fixture.json").read_text(encoding="utf-8"))
          for name, expected in metadata["files"].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          assert os.environ["CARGO_INCREMENTAL"] == "1"
          started = time.monotonic()
          with open("warm-build.jsonl", "w", encoding="utf-8") as messages:
              subprocess.run([
                  "cargo", "build", "--locked", "--release", "-p", "architect",
                  "--target-dir", "target/incremental-smoke", "--message-format=json",
              ], stdout=messages, check=True)
          artifacts = [json.loads(line) for line in Path("warm-build.jsonl").read_text(encoding="utf-8").splitlines()]
          compiled = [artifact for artifact in artifacts if artifact.get("reason") == "compiler-artifact"]
          report = {
              "restored_incremental_files": len(metadata["files"]),
              "warm_seconds": time.monotonic() - started,
              "fresh_units": sum(artifact.get("fresh") is True for artifact in compiled),
              "rebuilt_units": sum(artifact.get("fresh") is False for artifact in compiled),
          }
          Path("checkpoint-result.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: checkpoint-result-${{ matrix.os }}
          path: checkpoint-result.json
          retention-days: 7
          if-no-files-found: error

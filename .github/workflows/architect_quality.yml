# Fork-owned validation for Praxis, which lives on main. Reusable callers pass
# an exact staging SHA so automated syncs cannot publish unvalidated source.
name: Architect quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to validate
        required: true
        default: main
        type: string
  workflow_call:
    inputs:
      source_ref:
        description: Branch, tag, or commit to validate
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  # Only a newer PR revision supersedes work. Distinct non-PR runs (including
  # nested reusable calls) must not cancel each other or their callers.
  group: >-
    architect-quality-${{ github.event_name == 'pull_request' &&
    format('pr-{0}', github.event.pull_request.number) ||
    format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  SOURCE_REF: ${{ inputs.source_ref || github.sha }}

jobs:
  prepare:
    name: Resolve validation source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      validated: ${{ steps.reuse.outputs.validated }}
      rust: ${{ steps.scope.outputs.rust || 'true' }}
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Pin the actual checkout
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decide whether the change touches Rust
        id: scope
        if: hashFiles('script/ci-rust-changes.py') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python script/ci-rust-changes.py

      - name: Look for an original full validation
        id: reuse
        if: steps.scope.outputs.rust != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "PR required checks always execute the full suite"
            echo "validated=false" >> "$GITHUB_OUTPUT"
          elif [ -f script/praxis-validation.py ]; then
            python script/praxis-validation.py check \
              --repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA" \
              --quality-run --wait-seconds 300 || echo "validated=false" >> "$GITHUB_OUTPUT"
          else
            echo "No receipt helper in this source; running the full suite"
            echo "validated=false" >> "$GITHUB_OUTPUT"
          fi

  formatting:
    name: Formatting
    env:
      SOURCE_REF: ${{ needs.prepare.outputs.source_sha }}
      FORK_WORKFLOW_FILES: >-
        .github/workflows/architect_quality.yml
        .github/workflows/sync_upstream.yml
        .github/workflows/bundle_fork.yml
        .github/workflows/bundle_after_merge.yml
        .github/workflows/android_remote.yml
        .github/workflows/deploy_pages.yml
        .github/workflows/remote_relay_probe.yml
        .github/workflows/incremental_ci.yml
        .github/workflows/warm_ci_caches.yml
        .github/actions/rust-build-cache/action.yml
        .github/actions/save-rust-build-cache/action.yml
    needs: prepare
    if: needs.prepare.outputs.validated != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Test validation reuse provenance
        if: hashFiles('script/test-praxis-validation.py') != ''
        run: python script/test-praxis-validation.py

      - name: Test retained build checkpoints
        run: python script/test-ci-build-checkpoint.py

      - name: Test Rust change detection
        run: python script/test-ci-rust-changes.py

      - name: Test the integration test list
        run: python script/test-praxis-integration-tests.py

      - name: Test the upstream sync auto-resolver
        run: python script/test-resolve-upstream-sync.py

      - name: Test Unix split release packaging
        if: hashFiles('script/test-bundle-split-modes.py') != ''
        run: python script/test-bundle-split-modes.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "9"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check relay probe formatting
        if: hashFiles('script/probe-praxis-relay.rs') != ''
        run: rustfmt --edition 2024 --check script/probe-praxis-relay.rs

      - name: Check repository documentation formatting
        run: ./script/prettier

      - name: Check the fork workflow formatting
        # Word splitting of the file list is intended.
        run: pnpm dlx prettier@3.5.0 ${FORK_WORKFLOW_FILES} --check

      - name: Prepare formatting corrections
        if: failure()
        run: |
          cargo fmt --all
          if [ -f script/probe-praxis-relay.rs ]; then rustfmt --edition 2024 script/probe-praxis-relay.rs; fi
          if command -v pnpm >/dev/null; then
            ./script/prettier --write
            pnpm dlx prettier@3.5.0 ${FORK_WORKFLOW_FILES} --write
          fi
          git --no-pager diff --binary > rust-format.patch

      - name: Upload formatting corrections
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rust-format
          path: rust-format.patch
          if-no-files-found: ignore

      # Formatters only run in CI, so unformatted pushes used to cost a full
      # failed run plus a manual follow-up push that cancelled the next run.
      - name: Commit formatting corrections to this pull request
        if: >-
          failure() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          PUSH_TOKEN: ${{ secrets.PRAXIS_SYNC_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${PUSH_TOKEN}" ]; then
            echo "::notice::No push token is available; apply the rust-format artifact instead."
            exit 0
          fi
          git fetch --no-tags --quiet --depth=2 origin "${HEAD_SHA}"
          if [ "$(git log -1 --format=%s "${HEAD_SHA}")" = "Apply CI formatting" ]; then
            echo "::warning::The automatic formatting commit still fails formatting; not pushing again."
            exit 0
          fi
          git reset --hard --quiet
          git checkout --quiet --detach "${HEAD_SHA}"
          cargo fmt --all
          if [ -f script/probe-praxis-relay.rs ]; then rustfmt --edition 2024 script/probe-praxis-relay.rs; fi
          if command -v pnpm >/dev/null; then
            ./script/prettier --write
            pnpm dlx prettier@3.5.0 ${FORK_WORKFLOW_FILES} --write
          fi
          if git diff --quiet; then
            echo "The pull request head is already formatted; nothing to push."
            exit 0
          fi
          git -c user.name="praxis-format[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --all --message "Apply CI formatting"
          authorization="$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${authorization}"
          # A plain push refuses to overwrite a branch that moved meanwhile.
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}" \
            push --quiet origin "HEAD:refs/heads/${HEAD_REF}"; then
            echo "::notice::Pushed formatting corrections to ${HEAD_REF}; checks restart on that commit."
          else
            echo "::warning::Could not push formatting corrections; apply the rust-format artifact instead."
          fi

  architect-tests:
    name: ${{ matrix.name }}
    env:
      SOURCE_REF: ${{ needs.prepare.outputs.source_sha }}
    # Build jobs start beside formatting. When formatting pushes a correction,
    # the new commit's run cancels this one.
    needs: prepare
    if: needs.prepare.outputs.validated != 'true' && needs.prepare.outputs.rust != 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # macOS runners are often unavailable for hours, so macOS runs these
      # tests weekly in macos_path_checks.yml instead of gating every change.
      matrix:
        include:
          - name: Architect graph tests (Linux)
            runner: ubuntu-24.04
          - name: Architect graph tests (Windows)
            runner: windows-2022
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: architect-tests
          cache-on-failure: true
          # PR-scoped caches are unusable by other branches and evict main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test the Architect graph and runner
        run: cargo test --locked -p architect --lib

      - name: Test host-aware path primitives
        run: cargo test --locked -p path --lib

  agent-tests:
    name: Agent and canvas integration tests
    env:
      SOURCE_REF: ${{ needs.prepare.outputs.source_sha }}
      # Line tables keep backtraces readable at a fraction of the link time.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    needs: prepare
    if: needs.prepare.outputs.validated != 'true' && needs.prepare.outputs.rust != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Install Linux build dependencies
        run: ./script/linux

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: architect-agent-tests
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: nextest

      # One nextest invocation resolves features once, so shared crates build
      # once and every test binary links once. The list lives in
      # script/praxis-integration-tests.txt.
      - name: Build the agent and canvas tests
        run: python script/praxis-integration-tests.py --no-run

      - name: Test Praxis Remote and the agent and canvas integrations
        run: python script/praxis-integration-tests.py

  updater-tests:
    name: Auto-update integrity tests
    env:
      SOURCE_REF: ${{ needs.prepare.outputs.source_sha }}
    needs: prepare
    if: needs.prepare.outputs.validated != 'true' && needs.prepare.outputs.rust != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: architect-updater-tests
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test the updater
        run: cargo test --locked -p auto_update --lib

      - name: Test remote server installation
        run: |
          cargo test --locked -p remote --lib transport::tests::
          cargo test --locked -p remote --lib transport::wsl::tests::
          cargo test --locked -p remote --lib remote_client::tests::test_channel_client_

      - name: Test MCP OAuth client registration
        run: "cargo test --locked -p context_server --lib oauth::"

  windows-updater-tests:
    name: Windows update helper tests
    env:
      SOURCE_REF: ${{ needs.prepare.outputs.source_sha }}
    needs: prepare
    if: needs.prepare.outputs.validated != 'true' && needs.prepare.outputs.rust != 'false'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Test Windows split release packaging
        if: hashFiles('script/test-bundle-windows-modes.ps1') != ''
        shell: pwsh
        run: ./script/test-bundle-windows-modes.ps1

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: architect-windows-updater-tests
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test the Windows update helper
        run: cargo test --locked -p auto_update_helper

      # Builds the Windows-only terminal and window code that Linux checks skip.
      - name: Test Windows terminal process cleanup
        run: |
          cargo test --locked -p terminal --lib process_tree
          cargo check --locked -p gpui_windows

      - name: Check the Windows update helper with Clippy
        shell: bash
        run: ./script/clippy --locked -p auto_update_helper

  clippy:
    name: Clippy package checks
    env:
      SOURCE_REF: ${{ needs.prepare.outputs.source_sha }}
    needs: prepare
    if: needs.prepare.outputs.validated != 'true' && needs.prepare.outputs.rust != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Install Linux build dependencies
        run: ./script/linux

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: architect-clippy
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Tests only build the crates they test, so a change to any other crate
      # used to reach main without being compiled. Clippy runs beside the
      # much longer test jobs, so the extra crates do not delay the result.
      - name: Find the packages this change touches
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ env.SOURCE_REF }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          always = {"architect", "agent", "agent_ui", "auto_update", "context_server",
                    "feedback", "remote", "remote_direct", "gpui", "acp_thread"}
          # Other platforms' crates do not build here, and the zed binary is
          # built by the bundle after every merge.
          skipped = {"zed", "auto_update_helper", "gpui_macos", "gpui_windows",
                     "gpui_ios", "windows_resources"}
          compare = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/compare/main...{os.environ['SOURCE_SHA']}",
               "--jq", ".files[].filename"],
              capture_output=True, text=True)
          if compare.returncode != 0:
              print(f"::warning::Could not list the changed files: {compare.stderr.strip()}")
          metadata = json.loads(subprocess.run(
              ["cargo", "metadata", "--no-deps", "--locked", "--format-version", "1"],
              check=True, capture_output=True, text=True).stdout)
          root = metadata["workspace_root"]
          directories = {
              os.path.relpath(os.path.dirname(package["manifest_path"]), root) + "/": package["name"]
              for package in metadata["packages"]
          }
          changed = set()
          for path in compare.stdout.split():
              owners = [directory for directory in directories
                        if directory.startswith("crates/") and path.startswith(directory)]
              if owners:
                  changed.add(directories[max(owners, key=len)])
          extra = sorted(changed - always - skipped)
          print("Changed packages beyond the fixed set:", ", ".join(extra) or "none")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("packages=" + " ".join(f"-p {name}" for name in extra) + "\n")
          PY

      - name: Check the Architect packages with Clippy
        run: >-
          ./script/clippy --locked -p architect -p agent -p agent_ui -p auto_update
          -p context_server -p feedback -p remote -p remote_direct -p gpui -p acp_thread
          ${{ steps.changed.outputs.packages }}

  full-receipt:
    name: Record original full validation
    needs:
      - prepare
      - formatting
      - architect-tests
      - agent-tests
      - updater-tests
      - windows-updater-tests
      - clippy
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.validated != 'true' &&
      needs.formatting.result == 'success' &&
      needs.architect-tests.result == 'success' &&
      needs.agent-tests.result == 'success' &&
      needs.updater-tests.result == 'success' &&
      needs.windows-updater-tests.result == 'success' &&
      needs.clippy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Record verifiable full-run provenance
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          case "$GITHUB_WORKFLOW_REF" in
            "$GITHUB_REPOSITORY/.github/workflows/architect_quality.yml@"*)
              if [ "$SOURCE_SHA" != "$GITHUB_SHA" ]; then
                echo "recorded=not_applicable" >> "$GITHUB_OUTPUT"
                echo "::notice::The selected source differs from this dispatch's event SHA; full checks ran without issuing a reusable receipt"
              else
                python script/praxis-validation.py record \
                  --repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA"
              fi
              ;;
            *)
              echo "recorded=not_applicable" >> "$GITHUB_OUTPUT"
              echo "::notice::Reusable quality ran the full checks but does not issue a direct-run validation receipt"
              echo "Validation receipt: not applicable to this reusable workflow invocation." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - name: Upload original full validation receipt
        if: steps.receipt.outputs.recorded == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: praxis-quality-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 30

  source-validated:
    name: Quality source validated
    needs:
      - prepare
      - formatting
      - architect-tests
      - agent-tests
      - updater-tests
      - windows-updater-tests
      - clippy
      - full-receipt
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require verified reuse or every full check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["RESULTS"])
          prepare = results.pop("prepare")
          assert prepare["result"] == "success", "Source preparation failed"
          if prepare["outputs"].get("validated") == "true":
              assert all(job["result"] == "skipped" for job in results.values()), results
              print("Source has a verified original full validation; no new receipt issued")
          elif prepare["outputs"].get("rust") == "false":
              formatting = results.pop("formatting")
              assert formatting["result"] == "success", formatting
              assert all(job["result"] == "skipped" for job in results.values()), results
              print("No Rust-affecting files changed; formatting passed and the Rust jobs were skipped")
          else:
              assert all(job["result"] == "success" for job in results.values()), results
              print("All required quality jobs executed successfully")
          PY

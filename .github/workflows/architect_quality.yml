# Fork-owned validation for Praxis, which lives on main. Reusable callers pass
# an exact staging SHA so automated syncs cannot publish unvalidated source.
name: Architect quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to validate
        required: true
        default: main
        type: string
  workflow_call:
    inputs:
      source_ref:
        description: Branch, tag, or commit to validate
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  # Only a newer PR revision supersedes work. Distinct non-PR runs (including
  # nested reusable calls) must not cancel each other or their callers.
  group: >-
    architect-quality-${{ github.event_name == 'pull_request' &&
    format('pr-{0}', github.event.pull_request.number) ||
    format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  SOURCE_REF: ${{ inputs.source_ref || github.sha }}

jobs:
  prepare:
    name: Resolve validation source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      validated: ${{ steps.reuse.outputs.validated }}
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Pin the actual checkout
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Look for an original full validation
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "PR required checks always execute the full suite"
            echo "validated=false" >> "$GITHUB_OUTPUT"
          elif [ -f script/praxis-validation.py ]; then
            python script/praxis-validation.py check \
              --repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA" \
              --quality-run --wait-seconds 300 || echo "validated=false" >> "$GITHUB_OUTPUT"
          else
            echo "No receipt helper in this source; running the full suite"
            echo "validated=false" >> "$GITHUB_OUTPUT"
          fi

  formatting:
    name: Formatting
    env:
      SOURCE_REF: ${{ needs.prepare.outputs.source_sha }}
    needs: prepare
    if: needs.prepare.outputs.validated != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Test validation reuse provenance
        if: hashFiles('script/test-praxis-validation.py') != ''
        run: python script/test-praxis-validation.py

      - name: Test Unix split release packaging
        if: hashFiles('script/test-bundle-split-modes.py') != ''
        run: python script/test-bundle-split-modes.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "9"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check repository documentation formatting
        run: ./script/prettier

      - name: Check the fork workflow formatting
        run: >-
          pnpm dlx prettier@3.5.0
          .github/workflows/architect_quality.yml
          .github/workflows/sync_upstream.yml
          .github/workflows/bundle_fork.yml
          .github/workflows/bundle_after_merge.yml
          .github/workflows/android_remote.yml
          --check

      - name: Prepare formatting corrections
        if: failure()
        run: |
          cargo fmt --all
          ./script/prettier --write
          git --no-pager diff --binary > rust-format.patch

      - name: Upload formatting corrections
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rust-format
          path: rust-format.patch
          if-no-files-found: ignore

  architect-tests:
    name: ${{ matrix.name }}
    env:
      SOURCE_REF: ${{ needs.prepare.outputs.source_sha }}
    needs: prepare
    if: needs.prepare.outputs.validated != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Architect graph tests (Linux)
            runner: ubuntu-24.04
          - name: Architect graph tests (Windows)
            runner: windows-2022
          - name: Architect graph tests (macOS)
            runner: macos-15
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: architect-tests
          cache-on-failure: true

      - name: Test the Architect graph and runner
        run: cargo test --locked -p architect --lib

      - name: Test host-aware path primitives
        run: cargo test --locked -p path --lib

  agent-tests:
    name: Agent and canvas integration tests
    env:
      SOURCE_REF: ${{ needs.prepare.outputs.source_sha }}
    needs: prepare
    if: needs.prepare.outputs.validated != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Install Linux build dependencies
        run: ./script/linux

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: architect-agent-tests
          cache-on-failure: true

      - name: Test Plan-mode capability filtering
        run: "cargo test --locked -p agent --lib session_mode_tests::"

      - name: Test capability and structured-read tools
        run: |
          cargo test --locked -p agent --lib tools::tests::
          cargo test --locked -p agent --lib tools::context_server_registry::tests::
          cargo test --locked -p agent --lib tools::git_tool::tests::
          cargo test --locked -p agent --lib tools::pull_request_tool::tests::
          cargo test --locked -p agent --lib tools::refine_step_tool::tests::
          cargo test --locked -p agent --lib tools::draft_plan_tool::tests::
          cargo test --locked -p agent --lib tools::set_step_locks_tool::tests::
          cargo test --locked -p agent --lib internal_tests::test_set_step_locks_streaming_and_replay_avoid_thread_self_read -- --exact
          cargo test --locked -p agent --lib tools::architect_run_tool::tests::
          cargo test --locked -p agent --lib tools::architect_plan_tool::tests::
          cargo test --locked -p agent --lib internal_tests::test_available_native_agent_exposes_step_configuration -- --exact
          cargo test --locked -p agent --lib internal_tests::architect_coordinator_tool_tests::
          cargo test --locked -p agent --lib tools::exit_plan_mode_tool::tests::
          cargo test --locked -p agent --lib templates::tests::

      - name: Test native-agent mode and run integration
        run: |
          cargo test --locked -p agent --lib internal_tests::test_a_new_session_offers_plan_and_build -- --exact
          cargo test --locked -p agent --lib internal_tests::test_plan_mode_keeps_read_tools_and_denies_execution -- --exact
          cargo test --locked -p agent --lib internal_tests::test_plan_mode_and_filtered_tools_survive_reopening -- --exact
          cargo test --locked -p agent --lib internal_tests::test_architect_coordinator_owns_mode_and_cancellation -- --exact
          cargo test --locked -p agent --lib internal_tests::test_ask_question_is_available_to_root_threads_in_both_modes -- --exact
          cargo test --locked -p agent --lib internal_tests::test_a_step_thread_can_refine_its_step -- --exact
          cargo test --locked -p agent --lib internal_tests::test_each_architect_step_gets_an_independent_chat -- --exact
          cargo test --locked -p agent --lib internal_tests::test_a_reopened_step_thread_gets_its_tool_back -- --exact
          cargo test --locked -p agent --lib internal_tests::test_a_run_records_the_steps_it_took -- --exact
          cargo test --locked -p agent --lib internal_tests::test_each_run_step_runs_in_a_thread_of_its_own -- --exact
          cargo test --locked -p agent --lib internal_tests::test_parallel_branches_run_at_once_and_meet_at_the_join -- --exact
          cargo test --locked -p agent --lib internal_tests::test_a_paused_run_lets_its_steps_finish_and_resumes_where_it_was -- --exact
          cargo test --locked -p agent --lib internal_tests::test_a_stopped_run_resumes_at_the_step_it_was_on -- --exact
          cargo test --locked -p agent --lib internal_tests::test_steps_running_at_once_each_report_on_their_own_visit -- --exact
          cargo test --locked -p agent --lib internal_tests::test_step_completion_is_idempotent_and_rejects_stale_visits -- --exact
          cargo test --locked -p agent --lib db::tests::test_architect_graph_roundtrips_through_save_load -- --exact

      - name: Test live Architect recovery and per-step models
        run: |
          cargo test --locked -p agent --lib internal_tests::test_failed_architect_branch_resumes_without_replaying_completed_lanes -- --exact
          cargo test --locked -p agent --lib internal_tests::test_architect_revises_nested_pending_briefs_and_preserves_recovery -- --exact
          cargo test --locked -p agent --lib internal_tests::test_architect_models_update_future_steps_and_reject_active_or_invalid_edits -- --exact
          cargo test --locked -p agent --lib internal_tests::test_invalid_architect_model_fails_without_fallback_and_can_be_corrected -- --exact
          cargo test --locked -p agent --lib internal_tests::test_architect_branch_failure_retries_the_question_with_the_updated_model -- --exact
          cargo test --locked -p agent --lib internal_tests::test_architect_failure_wakes_paused_sibling_lanes -- --exact
          cargo test --locked -p agent --lib internal_tests::test_cancelled_architect_turn_does_not_complete_a_reported_step -- --exact
          cargo test --locked -p agent --lib internal_tests::test_stopping_architect_execution_keeps_the_coordinator_turn_alive -- --exact
          cargo test --locked -p settings_ui --lib tool_permissions_setup::tests::

      - name: Test Architect scheduling and durable history
        run: |
          cargo test --locked -p agent --lib test_subagent_thread_
          cargo test --locked -p agent --lib test_subagent_context_
          cargo test --locked -p agent --lib legacy_node_chat_roles_
          cargo test --locked -p agent --lib architect_runner::checkpoint_tests::

          cargo test --locked -p agent --lib internal_tests::architect_persistence_tests::
          cargo test --locked -p agent --lib db::tests::test_architect_state_legacy_migration -- --exact
          cargo test --locked -p acp_thread --lib test_tool_call_liveness

      - name: Test host-specific inventory path rules
        run: "cargo test --locked -p worktree --lib file_inventory::tests::"

      - name: Build remote inventory regressions
        run: cargo test --locked -p project --features test-support --test file_inventory --no-run

      - name: Test remote inventory regressions
        run: timeout --kill-after=10s 120s cargo test --locked -p project --features test-support --test file_inventory

      - name: Test context limits and compaction
        run: |
          cargo test --locked -p agent --lib compact
          cargo test --locked -p agent --lib prompt_too_large
          cargo test --locked -p agent --lib an_oversized_tool_result

      - name: Test loading-thread selection retention
        run: |
          cargo test --locked -p agent_ui --lib test_add_selection_to_loading_thread
          cargo test --locked -p agent_ui --lib test_loading_selection_
          cargo test --locked -p agent_ui --lib test_pending_selections_survive_connection_retry
          cargo test --locked -p agent_ui --lib test_auth_required_on_initial_connect
          cargo test --locked -p agent_ui --lib test_message_editing_insert_selections
          cargo test --locked -p agent_ui --lib test_insert_selections
          cargo test --locked -p agent_ui --lib test_add_selection_to_terminal_thread_pastes_mention

      - name: Test Architect canvas support
        run: |
          cargo test --locked -p agent_ui --lib architect_ui::
          cargo test --locked -p agent_ui --lib test_navigating_reports_only_threads_it_can_show

      - name: Test background terminal execution and lifecycle
        run: |
          cargo test --locked -p agent --lib terminal_tasks_
          cargo test --locked -p agent --lib test_background_terminal_
          cargo test --locked -p agent --lib test_native_terminal_registration_handoff_is_cancellation_safe
          cargo test --locked -p terminal --lib bounded_content
          cargo test --locked -p acp_thread --lib test_terminal_bounded_capture_reports_live_and_cached_truncation
          cargo test --locked -p agent --lib terminal_tool
          cargo test --locked -p agent --lib built_in_tool_schemas_are_normalized
          cargo test --locked -p settings_ui --lib test_all_tools_are_in_tool_info_or_excluded

      - name: Test GPUI input activity
        run: |
          cargo test --locked -p gpui --lib input_activity
          cargo test --locked -p gpui --lib test_window_activation_is_app_wide_and_precedes_observers
          cargo test --locked -p gpui --lib direct_text_input_records_activity

      - name: Test question recommendations and countdowns
        run: |
          cargo test --locked -p agent --lib tools::ask_question_tool::tests::
          cargo test --locked -p agent --lib internal_tests::test_ask_question_uses_the_owning_session_elicitation -- --exact
          cargo test --locked -p acp_thread --lib test_question_
          cargo test --locked -p agent_ui --lib conversation_view::elicitation::tests::question_
          cargo test --locked -p agent_ui --lib test_question_timeout_manual_text_and_choices_survive_blur

      - name: Test Praxis Remote
        run: |
          cargo test --locked -p agent_ui --lib remote::
          cargo test --locked -p agent_ui --lib test_remote_send_now_
          cargo test --locked -p agent --lib tools::terminal_task_tool::tests::
          cargo test --locked -p terminal_view --lib background_agent_terminals_

  updater-tests:
    name: Auto-update integrity tests
    env:
      SOURCE_REF: ${{ needs.prepare.outputs.source_sha }}
    needs: prepare
    if: needs.prepare.outputs.validated != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: architect-updater-tests
          cache-on-failure: true

      - name: Test the updater
        run: cargo test --locked -p auto_update --lib

      - name: Test remote server installation
        run: |
          cargo test --locked -p remote --lib transport::tests::
          cargo test --locked -p remote --lib transport::wsl::tests::
          cargo test --locked -p remote --lib remote_client::tests::test_channel_client_

      - name: Test MCP OAuth client registration
        run: "cargo test --locked -p context_server --lib oauth::"

  windows-updater-tests:
    name: Windows update helper tests
    env:
      SOURCE_REF: ${{ needs.prepare.outputs.source_sha }}
    needs: prepare
    if: needs.prepare.outputs.validated != 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Test Windows split release packaging
        if: hashFiles('script/test-bundle-windows-modes.ps1') != ''
        shell: pwsh
        run: ./script/test-bundle-windows-modes.ps1

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: architect-windows-updater-tests
          cache-on-failure: true

      - name: Test the Windows update helper
        run: cargo test --locked -p auto_update_helper

      - name: Check the Windows update helper with Clippy
        shell: bash
        run: ./script/clippy --locked -p auto_update_helper

  clippy:
    name: Clippy package checks
    env:
      SOURCE_REF: ${{ needs.prepare.outputs.source_sha }}
    needs: prepare
    if: needs.prepare.outputs.validated != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Install Linux build dependencies
        run: ./script/linux

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: architect-clippy
          cache-on-failure: true

      - name: Check the Architect packages with Clippy
        run: >-
          ./script/clippy --locked -p architect -p agent -p agent_ui -p auto_update
          -p context_server -p feedback -p remote -p gpui -p acp_thread

  full-receipt:
    name: Record original full validation
    needs:
      - prepare
      - formatting
      - architect-tests
      - agent-tests
      - updater-tests
      - windows-updater-tests
      - clippy
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.validated != 'true' &&
      needs.formatting.result == 'success' &&
      needs.architect-tests.result == 'success' &&
      needs.agent-tests.result == 'success' &&
      needs.updater-tests.result == 'success' &&
      needs.windows-updater-tests.result == 'success' &&
      needs.clippy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Record verifiable full-run provenance
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          if [ -f script/praxis-validation.py ]; then
            python script/praxis-validation.py record \
              --repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA"
          else
            echo "recorded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload original full validation receipt
        if: steps.receipt.outputs.recorded == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: praxis-quality-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 30

  source-validated:
    name: Quality source validated
    needs:
      - prepare
      - formatting
      - architect-tests
      - agent-tests
      - updater-tests
      - windows-updater-tests
      - clippy
      - full-receipt
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require verified reuse or every full check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["RESULTS"])
          prepare = results.pop("prepare")
          assert prepare["result"] == "success", "Source preparation failed"
          if prepare["outputs"].get("validated") == "true":
              assert all(job["result"] == "skipped" for job in results.values()), results
              print("Source has a verified original full validation; no new receipt issued")
          else:
              assert all(job["result"] == "success" for job in results.values()), results
              print("All required quality jobs executed successfully")
          PY

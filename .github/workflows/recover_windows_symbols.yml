name: Recover Praxis Windows symbols

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source revision whose cached symbols should be recovered
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Recover cached Windows PDBs
    runs-on: windows-2022
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      PRAXIS_UPDATE_MANIFEST_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
    steps:
      - name: Check out the built source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Restore the Windows bundle cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bundle-windows-x86_64
          save-if: false

      - name: Stage the debug-symbol archive
        shell: pwsh
        run: |
          $symbols = Get-ChildItem target -Recurse -File -Filter "*.pdb"
          $symbols |
            Sort-Object Length -Descending |
            Select-Object -First 100 FullName, Length |
            Format-Table -AutoSize
          $zedPdb = $symbols | Where-Object Name -EQ "zed.pdb" | Select-Object -First 1
          if (-not $zedPdb) {
            throw "The restored Windows bundle cache did not contain zed.pdb"
          }
          Compress-Archive $zedPdb.FullName target/Praxis-windows-x86_64.dbg.zip -Force

      - name: Upload the recovered symbols
        uses: actions/upload-artifact@v7
        with:
          name: praxis-windows-x86_64-symbols
          path: target/Praxis-windows-x86_64.dbg.zip
          if-no-files-found: error

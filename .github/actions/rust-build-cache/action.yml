name: Restore incremental Rust build state
description: Retain compatible workspace artifacts and incremental data without weakening validation
inputs:
  cache-name:
    description: Distinct platform, target architecture, desktop/server, and profile identity
    required: true
  legacy-key:
    description: Optional dependency-cache key used before incremental builds were enabled
    required: false
    default: ""
outputs:
  primary-key:
    description: Immutable key for saving this build
    value: ${{ steps.identity.outputs.key }}
  matched-key:
    description: Compatible cache restored, or empty for a cold build
    value: ${{ steps.restore.outputs.cache-matched-key }}
  cache-paths:
    description: Cargo registry/git and build intermediates, excluding credentials and release packages
    value: ${{ steps.identity.outputs.paths }}
runs:
  using: composite
  steps:
    - name: Identify the compiler and build recipe
      id: identity
      shell: bash
      env:
        CARGO_INCREMENTAL: "1"
        CACHE_NAME: ${{ inputs.cache-name }}
        CACHE_RECIPE: ${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'script/bundle-*', 'script/ci-incremental-cache.py', '.github/actions/rust-build-cache/action.yml') }}
      run: python script/ci-incremental-cache.py

    - name: Restore compatible workspace and incremental artifacts
      id: restore
      uses: actions/cache/restore@v5
      continue-on-error: true
      with:
        path: ${{ steps.identity.outputs.paths }}
        key: ${{ steps.identity.outputs.key }}
        restore-keys: ${{ steps.identity.outputs.prefix }}

    # This fallback warms the first build from existing non-incremental dependencies.
    # Never run its save hook: rust-cache removes target/*/incremental during cleanup.
    - name: Restore legacy dependencies on a cache miss
      if: steps.restore.outputs.cache-matched-key == '' && inputs.legacy-key != ''
      uses: Swatinem/rust-cache@v2
      continue-on-error: true
      env:
        CARGO_INCREMENTAL: "0"
      with:
        shared-key: ${{ inputs.legacy-key }}
        save-if: "false"

    - name: Enable incremental compilation after cache restoration
      shell: bash
      env:
        CARGO_INCREMENTAL: "1"
        RESTORED_CACHE: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        python - <<'PY'
        import os
        assert os.environ["CARGO_INCREMENTAL"] == "1"
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
            output.write("CARGO_INCREMENTAL=1\n")
        restored = os.environ.get("RESTORED_CACHE") or "miss; using available dependencies or a cold build"
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
            output.write(f"### Incremental Rust build\n\nCARGO_INCREMENTAL=1\n\nWorkspace cache: {restored}\n")
        print(f"CARGO_INCREMENTAL=1; workspace cache: {restored}")
        PY
